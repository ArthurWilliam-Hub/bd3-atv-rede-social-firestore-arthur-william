<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE - REDE SOCIAL</title>

    <link rel="stylesheet" href="./styles.css">

    <!-- jQuery e Socket.IO importados via CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

</head>

<body>

    <div class="header_container">
        <img src="./images/rede.png" />
        <h1>ATIVIDADE - REDE SOCIAL</h1>
    </div>

    <div class="button_post_container">
        <button name="btn_post" id="btn_post">POST</button>
    </div>

    <div class="posts_container"></div>

    <!-- ESTRUTURA HTML DO FORMULÁRIO MODAL: -->
    <div id="myModal" class="modal">

        <div class="modal-content">

            <span class="close">&times;</span>

            <div class="form_post_container">

                <h4>FAÇA UM POST</h4>

                <form name="frm_post" id="frm_post">

                    <input type="text" name="txt_titulo" id="txt_titulo" placeholder="TITULO DO POST">
                    <br />
                    <input type="text" name="txt_post" id="txt_post" placeholder="TEXTO DO POST">
                    <br />
                    <button name="btn_postar" id="btn_postar">POSTAR</button>

                </form>

            </div>

        </div>

    </div>

</body>

<script>

    /***** ABERTURA/FECHAMENTO DO FORMUÁRIO MODAL *****/
    let btn = document.getElementById('btn_post');
    let modal = document.getElementById("myModal");
    let span = document.getElementsByClassName("close")[0];

    //ABRE O FORMULÁRIO MODAL:
    btn.addEventListener('click', function (event) {
        event.preventDefault();
        modal.style.display = "block";
    });

    //FECHA O FORMULÁRIO MODAL:
    span.addEventListener('click', function (event) {
        modal.style.display = "none";
    });

    /***** CONEXÃO DO SOCKET.IO DO FRONT-END COM O BACK-END *****/
    const socket = io();

    /***** FUNÇÃO PARA RENDERIZAR UM POST NA TELA *****/
    function renderPost(post) {
        const data = new Date(post.data);
        const dataFormatada = `[${data.toLocaleDateString('pt-BR')} - ${data.toLocaleTimeString('pt-BR')}]`;

        // .text() evita que HTML digitado no post seja interpretado (XSS)
        const $post = $('<div class="post_container"></div>');
        $post.append($('<h4></h4>').text(post.titulo));
        $post.append($('<p></p>').text(post.texto));
        $post.append($('<span></span>').text(dataFormatada));

        $('.posts_container').append($post);
    }

    /***** previousMessage: posts já cadastrados *****/
    socket.on('previousMessage', function (posts) {
        $('.posts_container').empty();
        posts.forEach(renderPost);
    });

    /***** receivedMessage: novo post recebido em tempo real *****/
    socket.on('receivedMessage', function (post) {
        renderPost(post);
    });

    /***** ENVIO DE POSTS ATRAVÉS DO FORMULÁRIO (sendMessage) *****/
    $('#frm_post').on('submit', function (event) {
        event.preventDefault();

        const titulo = $('#txt_titulo').val().trim();
        const texto = $('#txt_post').val().trim();

        if (!titulo || !texto) {
            alert('Preencha o título e o texto do post!');
            return;
        }

        socket.emit('sendMessage', { titulo: titulo, texto: texto });

        this.reset();
        modal.style.display = 'none';
    });

</script>

</html>
